name: Deploy saas-ideas to Cloudflare Pages

# Reproduces the manual deploy in AGENTS.md:
#   python3 scripts/build.py && npx wrangler pages deploy ./site --project-name saas-ideas
# Production deploy is manual dispatch only.
# Rollback: Cloudflare Pages preserves every deployment. Roll back via
# dash.cloudflare.com → Pages → saas-ideas → Deployments → "Rollback to this
# deployment".
on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # build.py reads git history for solopreneur_ideas.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rebuild catalog from source of truth
        run: python3 scripts/build.py

      - name: Validate docs (frontmatter + internal links)
        run: python3 scripts/check-docs.py

      - name: Verify generated artifacts exist and are non-empty
        run: |
          test -s README.md
          test -s site/ideas.json
          python3 -c "import json;d=json.load(open('site/ideas.json'));assert len(d)>0,'ideas.json empty';print('rows:',len(d))"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy ./site --project-name=saas-ideas --branch=main

      - name: Smoke production
        run: curl --fail --silent --show-error --location --output /dev/null --retry 3 --retry-delay 5 --max-time 20 https://ideas.sassmaker.com/
